<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS Resume Optimizer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <span class="logo-icon">📄</span>
      <span class="logo-text">ATS Resume Optimizer</span>
    </div>
    <p class="tagline">AI-powered resume optimization that beats the bots</p>
  </header>

  <main>
    <!-- STEP 1: Job Description -->
    <section class="card" id="step1">
      <h2><span class="step-badge">1</span> Job Description</h2>
      <div class="tab-bar">
        <button class="tab active" data-tab="url">URL</button>
        <button class="tab" data-tab="file">Upload File</button>
        <button class="tab" data-tab="text">Paste Text</button>
      </div>

      <div class="tab-panel active" id="tab-url">
        <input type="url" id="job-url" placeholder="https://company.com/jobs/software-engineer" />
        <button class="btn primary" onclick="loadJobFromUrl()">Fetch & Analyze</button>
      </div>

      <div class="tab-panel" id="tab-file">
        <div class="dropzone" id="job-dropzone" onclick="document.getElementById('job-file').click()">
          <span>Drop PDF / DOCX / TXT here or click to browse</span>
          <input type="file" id="job-file" accept=".pdf,.docx,.txt" hidden onchange="loadJobFromFile()" />
        </div>
      </div>

      <div class="tab-panel" id="tab-text">
        <textarea id="job-text" rows="10" placeholder="Paste the full job description here…"></textarea>
        <button class="btn primary" onclick="loadJobFromText()">Analyze</button>
      </div>

      <div id="job-status" class="status"></div>
    </section>

    <!-- Job Requirements Preview -->
    <section class="card hidden" id="requirements-section">
      <h2>Extracted Requirements</h2>
      <div id="requirements-display"></div>
    </section>

    <!-- STEP 2: Your Resume -->
    <section class="card hidden" id="step2">
      <h2><span class="step-badge">2</span> Your Resume / Experience</h2>
      <div class="tab-bar">
        <button class="tab active" data-tab="resume-file">Upload Resume</button>
        <button class="tab" data-tab="resume-text">Paste Resume</button>
        <button class="tab" data-tab="resume-build">Build from Scratch</button>
      </div>

      <div class="tab-panel active" id="tab-resume-file">
        <div class="dropzone" id="resume-dropzone" onclick="document.getElementById('resume-file').click()">
          <span>Drop PDF / DOCX / TXT here or click to browse</span>
          <input type="file" id="resume-file" accept=".pdf,.docx,.txt" hidden onchange="handleResumeFile()" />
        </div>
        <div id="resume-file-name" class="file-name"></div>
        <button class="btn primary hidden" id="optimize-file-btn" onclick="optimizeResumeFile()">Optimize Resume</button>
      </div>

      <div class="tab-panel" id="tab-resume-text">
        <textarea id="resume-text-input" rows="15" placeholder="Paste your current resume here…"></textarea>
        <button class="btn primary" onclick="optimizeResumeText()">Optimize Resume</button>
      </div>

      <div class="tab-panel" id="tab-resume-build">
        <div class="build-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="b-name" placeholder="Jane Smith" />
          </div>
          <div class="form-group">
            <label>Email &amp; Phone</label>
            <input type="text" id="b-contact" placeholder="jane@email.com | 555-123-4567" />
          </div>
          <div class="form-group">
            <label>LinkedIn / Portfolio URL</label>
            <input type="text" id="b-links" placeholder="linkedin.com/in/janesmith" />
          </div>
          <div class="form-group">
            <label>Professional Summary (optional)</label>
            <textarea id="b-summary" rows="3" placeholder="Brief summary of your background and goals…"></textarea>
          </div>
          <div class="form-group">
            <label>Skills (comma-separated)</label>
            <input type="text" id="b-skills" placeholder="Python, SQL, Project Management, Agile…" />
          </div>
          <div class="form-group">
            <label>Work Experience</label>
            <div id="exp-entries">
              <div class="exp-entry">
                <input type="text" placeholder="Job Title" class="exp-title" />
                <input type="text" placeholder="Company" class="exp-company" />
                <input type="text" placeholder="Dates (e.g. Jan 2020 – Present)" class="exp-dates" />
                <textarea rows="3" placeholder="Key responsibilities and achievements…" class="exp-desc"></textarea>
              </div>
            </div>
            <button class="btn ghost" onclick="addExpEntry()">+ Add Another Role</button>
          </div>
          <div class="form-group">
            <label>Education</label>
            <input type="text" id="b-edu" placeholder="B.S. Computer Science, State University, 2018" />
          </div>
          <div class="form-group">
            <label>Certifications (optional)</label>
            <input type="text" id="b-certs" placeholder="AWS Solutions Architect, PMP…" />
          </div>
          <button class="btn primary" onclick="buildFromScratch()">Build &amp; Optimize Resume</button>
        </div>
      </div>

      <div id="resume-status" class="status"></div>
    </section>

    <!-- STEP 3: Results -->
    <section class="card hidden" id="step3">
      <h2><span class="step-badge">3</span> Results</h2>

      <div class="score-grid">
        <div class="score-card" id="score-before">
          <div class="score-label">Before</div>
          <div class="score-circle" id="score-before-val">—</div>
          <div class="score-sub">ATS Score</div>
        </div>
        <div class="score-arrow">→</div>
        <div class="score-card highlight" id="score-after">
          <div class="score-label">After</div>
          <div class="score-circle" id="score-after-val">—</div>
          <div class="score-sub">ATS Score</div>
        </div>
      </div>

      <div class="breakdown" id="score-breakdown"></div>

      <div class="result-tabs">
        <button class="tab active" data-result-tab="optimized">Optimized Resume</button>
        <button class="tab" data-result-tab="analysis">Gap Analysis</button>
      </div>

      <div class="result-panel active" id="result-optimized">
        <div class="resume-output" id="optimized-text"></div>
        <button class="btn secondary" onclick="copyResume()">Copy to Clipboard</button>
        <button class="btn secondary" onclick="downloadResume()">Download .txt</button>
      </div>

      <div class="result-panel" id="result-analysis">
        <div id="analysis-display"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
