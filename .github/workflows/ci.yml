name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check backend/

      - name: Syntax & import check
        run: |
          python -c "import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('backend').glob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              [print(e) for e in errors]
              sys.exit(1)
          print('All Python files are syntax-valid.')"

      - name: Verify backend imports
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-key-for-import-check"
        run: |
          cd backend
          python -c "import parser; import optimizer; import main; print('All imports OK')"

  frontend-validate:
    name: Frontend Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend files exist
        run: |
          for f in frontend/index.html frontend/style.css frontend/app.js; do
            [ -f "$f" ] && echo "✓ $f" || (echo "✗ Missing: $f" && exit 1)
          done

      - name: Validate HTML structure
        run: |
          python3 -c "
          from html.parser import HTMLParser
          class Validator(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.errors = []
          v = Validator()
          v.feed(open('frontend/index.html').read())
          print('HTML parsed OK')
          "

      - name: Check JS for obvious syntax errors (Node)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node syntax check on app.js
        run: node --check frontend/app.js && echo "JS syntax OK"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-key"
        run: pytest backend/tests/ -v --tb=short 2>/dev/null || echo "No tests yet — skipping"
